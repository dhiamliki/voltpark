spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: session-service
          uri: ${SESSION_SERVICE_URL:http://session-service:8081}
          predicates:
            - Path=/api/v1/**

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
