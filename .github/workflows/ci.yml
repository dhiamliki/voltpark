name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# un seul pipeline en cours par branche : un nouveau push annule le precedent
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    name: java (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # un service en echec n'arrete pas les autres
      fail-fast: false
      matrix:
        service:
          - session-service
          - charger-gateway-service
          - energy-service
          - api-gateway
          - charger-simulator
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  compose:
    # test de bout en bout : toute la stack Docker Compose, puis le parcours de demonstration
    needs: [java, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Smoke test (scripts/demo/full-flow.sh)
        shell: bash
        env:
          GATEWAY_URL: http://localhost:8080
        run: |
          sh scripts/demo/full-flow.sh 10 | tee full-flow.log
          # le script ne s'arrete en erreur que sur certains echecs : on verifie aussi son resultat
          grep -q "statut ACTIVE, transaction borne" full-flow.log    # session demarree (SOAP)
          grep -q "mesure :" full-flow.log                            # suivi en direct (SSE + gRPC)
          grep -q "statut COMPLETED, energie" full-flow.log           # session arretee
          grep -qE "facture id=[0-9]+, statut ISSUED" full-flow.log   # facture emise
          if grep -qE "HTTP 5[0-9]{2}" full-flow.log; then
            echo "Erreur serveur pendant le parcours"
            exit 1
          fi

      - name: Containers
        if: always()
        run: docker compose ps

      - name: Logs
        if: failure()
        run: docker compose logs --tail=150

      - name: Stop the stack
        if: always()
        run: docker compose down -v
