spring:
  application:
    name: charger-simulator

server:
  port: ${SERVER_PORT:8084}

grpc:
  client:
    energy-service:
      address: ${ENERGY_GRPC_ADDRESS:static://localhost:9090}
      negotiation-type: plaintext

simulator:
  enabled: ${SIMULATOR_ENABLED:true}
  charger-id: ${SIMULATOR_CHARGER_ID:CP-460375-1}
  interval-seconds: ${SIMULATOR_INTERVAL_SECONDS:120}
  duration-seconds: ${SIMULATOR_DURATION_SECONDS:60}
  time-factor: ${SIMULATOR_TIME_FACTOR:60}
  max-session-seconds: ${SIMULATOR_MAX_SESSION_SECONDS:600}

resilience4j:
  retry:
    instances:
      energyService:
        max-attempts: 5
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exception-predicate: tn.voltpark.simulator.config.RetryableGrpcError

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
