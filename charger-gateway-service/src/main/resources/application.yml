spring:
  application:
    name: charger-gateway-service
  datasource:
    url: ${CHARGER_DB_URL:jdbc:postgresql://localhost:5433/charger_db}
    username: ${CHARGER_DB_USER}
    password: ${CHARGER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

voltpark:
  # simulateur de bornes : previent quand une transaction demarre ou s'arrete
  simulator:
    url: ${SIMULATOR_URL:http://charger-simulator:8084}
    connect-timeout-ms: ${SIMULATOR_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${SIMULATOR_READ_TIMEOUT_MS:3000}
