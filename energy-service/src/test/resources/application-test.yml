spring:
  datasource:
    url: jdbc:h2:mem:energy;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

grpc:
  server:
    # pas de port reseau : serveur en memoire uniquement
    port: -1
    in-process-name: energy-test

voltpark:
  watch:
    poll-interval: 100ms
