server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # fichiers generes par Vite : leur nom contient un hash, ils peuvent etre gardes longtemps
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # application monopage : toutes les autres URL renvoient index.html (React Router)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
