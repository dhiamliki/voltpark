// Contrat gRPC de l'energy-service (version 1).
//
// Proprietaire : energy-service. Des copies existent dans charger-simulator et
// session-service ; elles doivent etre mises a jour dans le meme commit.
//
// Evolution du contrat :
//   - ne jamais reutiliser un numero de champ deja publie ;
//   - lors de la suppression d'un champ, declarer son numero et son nom avec `reserved` ;
//   - ajouter un champ (nouveau numero) est compatible ; renommer, changer le type
//     ou le numero d'un champ ne l'est pas ;
//   - tout changement incompatible va dans un nouveau package `voltpark.energy.v2`,
//     la v1 restant disponible pendant la migration des clients.

syntax = "proto3";

package voltpark.energy.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "tn.voltpark.energy.grpc.v1";
option java_outer_classname = "EnergyProto";

service EnergyService {

  // Client streaming : une borne envoie ses mesures pendant une session de charge.
  // Le serveur repond une seule fois, a la fermeture du flux, avec un resume.
  // Codes d'erreur :
  //   NOT_FOUND           session inconnue
  //   INVALID_ARGUMENT    energie negative ou inferieure a la mesure precedente, soc hors 0-100
  //   FAILED_PRECONDITION session deja cloturee
  //   DEADLINE_EXCEEDED   cote client, si le delai fixe par l'appelant est depasse
  rpc StreamMeterValues(stream MeterValue) returns (StreamSummary);

  // Server streaming : suivi en direct d'une session (vue conducteur).
  // Le serveur pousse un SessionProgress a chaque nouvelle mesure, jusqu'a la fin de la session.
  // Codes d'erreur :
  //   NOT_FOUND           session inconnue
  //   FAILED_PRECONDITION session deja cloturee
  //   DEADLINE_EXCEEDED   cote client, si le delai fixe par l'appelant est depasse
  rpc WatchSession(WatchSessionRequest) returns (stream SessionProgress);

  // Unary : energie totale d'une session, utilisee par session-service pour la facturation.
  // Codes d'erreur :
  //   NOT_FOUND           session inconnue
  //   INVALID_ARGUMENT    session_id vide
  //   DEADLINE_EXCEEDED   cote client, si le delai fixe par l'appelant est depasse
  rpc GetSessionEnergy(GetSessionEnergyRequest) returns (SessionEnergy);
}

// Mesure envoyee par une borne.
message MeterValue {
  string session_id = 1;
  string charger_id = 2;
  google.protobuf.Timestamp timestamp = 3;
  double power_kw = 4;
  // Energie cumulee depuis le debut de la session (ne doit jamais diminuer).
  double energy_kwh = 5;
  // Etat de charge de la batterie, de 0 a 100.
  int32 soc_percent = 6;
}

// Resume renvoye a la fin du flux StreamMeterValues.
message StreamSummary {
  string session_id = 1;
  int64 readings_received = 2;
  double last_energy_kwh = 3;
}

message WatchSessionRequest {
  string session_id = 1;
}

// Etat courant d'une session, pousse par WatchSession.
message SessionProgress {
  string session_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  double power_kw = 3;
  double energy_kwh = 4;
  int32 soc_percent = 5;
  int32 estimated_minutes_remaining = 6;
}

message GetSessionEnergyRequest {
  string session_id = 1;
}

// Bilan energetique d'une session.
message SessionEnergy {
  string session_id = 1;
  double total_energy_kwh = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp last_reading_at = 4;
  // Repartition pour le tarif heures pleines / heures creuses.
  double peak_kwh = 5;
  double off_peak_kwh = 6;
  int64 readings_count = 7;
}
