spring:
  application:
    name: session-service
  datasource:
    url: ${SESSION_DB_URL:jdbc:postgresql://localhost:5432/session_db}
    username: ${SESSION_DB_USER}
    password: ${SESSION_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

voltpark:
  clients:
    charger-gateway:
      url: ${CHARGER_GATEWAY_URL:http://localhost:8082/ws}
      connection-timeout-ms: 3000
      read-timeout-ms: 5000

grpc:
  client:
    energy-service:
      address: ${ENERGY_GRPC_ADDRESS:static://localhost:9090}
      negotiation-type: plaintext

resilience4j:
  circuitbreaker:
    instances:
      chargerGateway:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 2
        failureRateThreshold: 50.0
        waitDurationInOpenState: 5000ms
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      chargerGateway:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
