spring:
  application:
    name: session-service
  datasource:
    url: ${SESSION_DB_URL:jdbc:postgresql://localhost:5432/session_db}
    username: ${SESSION_DB_USER}
    password: ${SESSION_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT:8081}
  # en-tetes X-Forwarded-* de l'api-gateway : les en-tetes Location pointent vers la gateway
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

voltpark:
  clients:
    charger-gateway:
      url: ${CHARGER_GATEWAY_URL:http://localhost:8082/ws}
      connection-timeout-ms: 3000
      read-timeout-ms: 5000
    energy:
      # deadline de chaque appel gRPC vers energy-service
      deadline-ms: ${ENERGY_GRPC_DEADLINE_MS:2000}
  live:
    # duree maximale d'un flux GET /api/v1/sessions/{id}/live (et deadline du WatchSession)
    timeout-ms: ${SESSION_LIVE_TIMEOUT_MS:900000}

grpc:
  client:
    energy-service:
      address: ${ENERGY_GRPC_ADDRESS:static://localhost:9090}
      negotiation-type: plaintext

resilience4j:
  circuitbreaker:
    instances:
      chargerGateway:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 2
        failureRateThreshold: 50.0
        waitDurationInOpenState: 5000ms
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # SOAP Fault metier (refus de la borne) : pas une panne, ne compte pas comme echec
        ignoreExceptions:
          - tn.voltpark.session.api.error.ChargerFaultException
      energyService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50.0
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 1
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # "pas de mesure" n'est pas une panne d'energy-service
        ignoreExceptions:
          - tn.voltpark.session.api.error.EnergyDataNotFoundException
  retry:
    instances:
      chargerGateway:
        # 3 essais : 300 ms puis 600 ms d'attente entre eux
        maxAttempts: 3
        waitDuration: 300ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        # jamais de nouvel essai pour un refus de la borne ni quand le circuit est ouvert
        ignoreExceptions:
          - tn.voltpark.session.api.error.ChargerFaultException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      energyService:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        # uniquement UNAVAILABLE et DEADLINE_EXCEEDED
        retryExceptionPredicate: tn.voltpark.session.client.grpc.RetryableEnergyError
