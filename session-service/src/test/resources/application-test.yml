spring:
  datasource:
    url: jdbc:h2:mem:sessiondb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

voltpark:
  clients:
    charger-gateway:
      url: http://localhost:8082/ws
      connection-timeout-ms: 1000
      read-timeout-ms: 1000

resilience4j:
  circuitbreaker:
    instances:
      chargerGateway:
        slidingWindowSize: 3
        minimumNumberOfCalls: 2
        failureRateThreshold: 50.0
        waitDurationInOpenState: 1000ms
  retry:
    instances:
      chargerGateway:
        maxAttempts: 2
        waitDuration: 100ms
        enableExponentialBackoff: false
